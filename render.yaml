# Render.com 部署配置
services:
  - type: web
    name: cross-border-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: cross-border-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ALIBABA_APP_KEY
        sync: false
      - key: ALIBABA_APP_SECRET
        sync: false
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: ALIEXPRESS_ACCESS_TOKEN
        sync: false
      - key: OSS_ACCESS_KEY_ID
        sync: false
      - key: OSS_ACCESS_KEY_SECRET
        sync: false
      - key: OSS_BUCKET_NAME
        sync: false
      - key: OSS_ENDPOINT
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: cross-border-db
    plan: free
